---
# Description:
#   This test case is used for checking VM is encrypted when adding
# vTPM device to VM, VM is not encrypted after removing vTPM device.
#
- name: vtpm_cold_add_remove
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "Test case block"
      block:
        - name: "Test setup"
          include_tasks: ../setup/test_setup.yml
          vars:
            create_test_case_folder: true

        - name: "Skip test case"
          include_tasks: ../../common/skip_test_case.yml
          vars:
            skip_msg: >-
              Test case '{{ ansible_play_name }}' is skipped because vCenter server is not configured,
              while vTPM device configuration requires to connect to it in this test case.
            skip_reason: "Not Applicable"
          when: not vcenter_is_defined

        - name: "Skip test case"
          include_tasks: ../../common/skip_test_case.yml
          vars:
            skip_msg: "Skip test case due to VM hardware version is: {{ vm_hardware_version_num }}, not >= 14."
            skip_reason: "Not Supported"
          when: vm_hardware_version_num | int < 14

        # At the FreeBSD kernel level: there are currently no official drivers or tools supporting vTPM, so the functionality is unavailable.
        - name: "Skip test case"
          include_tasks: ../../common/skip_test_case.yml
          vars:
            skip_msg: >-
              Skip test case {{ ansible_play_name }} because vTPM is not supported
              for {{ vm_guest_os_distribution }} guest OS on ESXi on {{ esxi_cpu_vendor }}.
            skip_reason: "Not Supported"
          when: guest_os_ansible_distribution == "FreeBSD"

        - name: "Skip test case"
          include_tasks: ../../common/skip_test_case.yml
          vars:
            skip_msg: "Skip test case due to VM firmware is: {{ vm_firmware }}, not EFI."
            skip_reason: "Not Applicable"
          when: vm_firmware != 'efi'

        - name: "Cold add and remove VM vTPM device test"
          include_tasks: vtpm_add_remove_test.yml
      rescue:
        - name: "Test case failure"
          include_tasks: ../../common/test_rescue.yml

        - name: "Clean up cloned VM on failure"
          when:
            - vm_name_clone_to is defined
            - vm_name == vm_name_clone_to
          block:
            - name: "Check cloned VM existence"
              include_tasks: ../../common/vm_check_exist.yml

            - name: "Power off and remove cloned VM"
              when: vm_exists
              block:
                - name: "Get cloned VM power state"
                  include_tasks: ../../common/vm_get_power_state.yml

                - name: "Power off cloned VM if running"
                  include_tasks: ../../common/vm_set_power_state.yml
                  vars:
                    vm_power_state_set: 'powered-off'
                  when: vm_power_state_get != "poweredOff"

                - name: "Remove cloned VM"
                  include_tasks: ../../common/vm_remove.yml
                  vars:
                    vm_remove_ignore_errors: true
      always:
        - name: "Revert back VM name and VM primary MAC address"
          ansible.builtin.set_fact:
            vm_name: "{{ vm_name_clone_from }}"
            vm_primary_nic_mac: "{{ vm_nic_mac_clone_from }}"
            vm_dir_name: "{{ vm_dir_name_clone_from }}"
          when:
            - vm_name_clone_from is defined
            - vm_nic_mac_clone_from is defined
            - vm_dir_name_clone_from is defined
