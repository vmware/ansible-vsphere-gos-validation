# Test snapshot task and won't be committed
- name: test_snaphot
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "Test setup"
      include_tasks: ../setup/test_setup.yml
      vars:
        create_test_log_folder: true

    # reset_base_snapshot.yml will remove, rename and take snapshot
    - name: "Take a new snapshot and set it as base snapshot"
      include_tasks: ../../common/reset_base_snapshot.yml

    - name: "Take a snapshot 1"
      include_tasks: ../../common/vm_take_snapshot.yml
      vars:
        snapshot_name: "snapshot_1"
    
    - name: "Take a snapshot 2"
      include_tasks: ../../common/vm_take_snapshot.yml
      vars:
        snapshot_name: "snapshot_2"
    
    - include_tasks: ../../common/vm_remove_snapshot.yml
      vars:
        snapshot_remove_all: true

    - name: "Take a snapshot 3"
      include_tasks: ../../common/vm_take_snapshot.yml
      vars:
        snapshot_name: "snapshot_3"

    - name: "Take a snapshot 4"
      include_tasks: ../../common/vm_take_snapshot.yml
      vars:
        snapshot_name: "snapshot_4"

    - name: "Rename snapshot"
      include_tasks: vm_rename_snapshot.yml
      vars:
        current_snapshot_name: "snapshot_4"
        new_snapshot_name: "snapshot_44"
        new_snapshot_description: "4444"

    - name: "Revert snapshot to snapshot_3"
      include_tasks: ../common/vm_revert_snapshot.yml
      vars:
        snapshot_name: "snapshot_3"
        skip_if_not_exist: true

    - name: "Revert snapshot to non-existing snapshot"
      include_tasks: ../common/vm_revert_snapshot.yml
      vars:
        snapshot_name: "snapshot_1"
        skip_if_not_exist: false
