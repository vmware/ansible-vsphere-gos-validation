---
# Cleanup testing environment
- name: env_cleanup
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "Dump all variables used in tests"
      ansible.builtin.copy:
        dest: "{{ testrun_log_path }}/all_vars.json"
        content: "{{ vars | to_nice_json }}"
        mode: '0644'

    # Revert to VM base snapshot firstly, or the network testbed cleanup tasks may fail.
    # Parameter 'vm_not_revert_base' is used internally, and please be aware that if it's
    # set to true, the following tasks may be affected.
    - name: "Check whether base snapshot exists or not"
      include_tasks: ../common/vm_check_snapshot_exist.yml
      vars:
        snapshot_name: "{{ base_snapshot_name }}"

    - name: "Revert to snapshot {{ base_snapshot_name }}"
      include_tasks: ../common/vm_revert_snapshot.yml
      vars:
        snapshot_name: "{{ base_snapshot_name }}"
      when:
        - not vm_not_revert_base | default(false)
        - snapshot_exist

    - name: "Cleanup network environment"
      include_tasks: ../common/network_testbed_cleanup.yml

    - name: "Cleanup VM when cleanup_vm is set to true"
      when: cleanup_vm | bool
      block:
        - name: "Release DHCP IP address in guest OS"
          include_tasks: ../common/vm_release_dhcp_ip.yml
          when: release_vm_dhcp_ip | bool

        - name: "Power off VM"
          include_tasks: ../common/vm_set_power_state.yml
          vars:
            vm_power_state_set: 'powered-off'

        - name: "Remove VM"
          include_tasks: ../common/vm_remove.yml
          vars:
            vm_remove_ignore_errors: true

        - name: "Set VM cleaned flag to true and VM exists to false"
          ansible.builtin.set_fact:
            vm_cleaned_up: true
            vm_exists: false
          when:
            - vm_remove_result.changed is defined
            - vm_remove_result.changed

    - name: "Restore base snapshot for Windows Update installation"
      when:
        - win_update_snapshot_name is defined
        - win_update_snapshot_name
        - (vm_exists is defined and vm_exists)
      block:
        - name: "Revert to original base snapshot {{ win_update_snapshot_name }}"
          include_tasks: ../common/vm_revert_snapshot.yml
          vars:
            snapshot_name: "{{ win_update_snapshot_name }}"
        - name: "Remove the current base snapshot {{ base_snapshot_name }}"
          include_tasks: ../common/vm_remove_snapshot.yml
          vars:
            snapshot_name: "{{ base_snapshot_name }}"
          when: base_snapshot_exists
        - name: "Rename snapshot {{ win_update_snapshot_name }} to {{ base_snapshot_name }}"
          include_tasks: ../common/vm_rename_snapshot.yml
          vars:
            current_snapshot_name: "{{ win_update_snapshot_name }}"
            new_snapshot_name: "{{ base_snapshot_name }}"
