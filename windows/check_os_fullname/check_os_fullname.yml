---
# Description:
#   This test case is used for checking VM guest OS fullname
# and guest OS ID are reported correctly in the VM guest info
# by VMware Tools. When VMware Tools is not installed or not
# running in the guest OS, this test case result is 'Blocked'.
#
- name: check_os_fullname
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "Test case block"
      block:
        - name: "Test setup"
          include_tasks: ../setup/test_setup.yml
          vars:
            skip_test_no_vmtools: true

        - name: "Get VM guestinfo from VMware Tools"
          include_tasks: ../../common/vm_get_guest_info.yml

        - name: "Include guest OS defination list"
          include_tasks: win_guest_os_defination.yml

        - name: "Print the VM and installed guest OS info before checking"
          ansible.builtin.debug:
            msg:
              - "OS architecture got in guest OS: {{ guest_os_ansible_architecture }}"
              - "OS fullname got in guest OS: {{ guest_os_ansible_distribution }}"
              - "OS fullname got in VM guestinfo: {{ guestinfo_guest_full_name }}"
              - "VM guest ID configured: {{ vm_guest_id }}"
              - "VM guest ID got in VM guestinfo: {{ guestinfo_guest_id }}"
              - "VM hardware version: {{ vm_hardware_version }}"
 
        - name: "Set fact of current OS name"
          ansible.builtin.set_fact:
            current_gos: "{{ guest_os_ansible_distribution | regex_search('Windows( Server)? ([0-9]+)') }}"

        - name: "Initialize usable Windows guest OS definitions"
          ansible.builtin.set_fact:
            usable_win_gos_info: []

        - name: "Collect Windows guest OS definitions with available properties"
          ansible.builtin.set_fact:
            usable_win_gos_info: "{{ usable_win_gos_info + [item] }}"
          loop: "{{ win_gos_info }}"
          loop_control:
            label: "{{ item.win_guest }}"
          vars:
            required_win_gos_keys:
              - win_guest_id
              - win_guest_vmtools
              - win_guest_creation_esxi
              - win_guest_creation_hwv
              - win_guest_fullname
          when:
            - required_win_gos_keys | difference(item.keys() | list) | length == 0
            - item.win_guest_id | default([]) | length > 0
            - item.win_guest_fullname | default([]) | length > 0
            - >-
              item | dict2items | selectattr('key', 'match', '^win_guest_')
              | map(attribute='value') | flatten
              | select('in', ['NA', 'N/A']) | list | length == 0

        - name: "Get matched info in the guest OS defination list for current OS name"
          ansible.builtin.set_fact:
            current_gos_info: "{{ usable_win_gos_info | selectattr('win_guest', 'equalto', current_gos) }}"

        # Definitions are ordered oldest to newest within each OS family.
        # Missing versions and entries with unavailable properties use the same fallback.
        - name: "Use the last usable OS in the same family when no usable exact match exists"
          ansible.builtin.set_fact:
            current_gos_info: >-
              {{ (usable_win_gos_info
                  | selectattr('win_guest', 'match',
                      '^Windows (?!Server )' if guest_os_product_type == 'client' else '^Windows Server ')
                  | list)[-1:] }}
          when: current_gos_info | length == 0

        - name: "Check matched info"
          ansible.builtin.assert:
            that:
              - current_gos_info | length == 1
            fail_msg: >
              "Do not get the matched info in the guest OS defination list for current OS name '{{ current_gos }}',
              Please check whether this guest OS is supported and is added to the defination list file."

        - name: "Set fact of the matched current OS info"
          ansible.builtin.set_fact:
            current_gos_info: "{{ current_gos_info[0] }}"
            current_gos: "{{ current_gos_info[0].win_guest }}"

        - name: "Handle Windows 11 known issue"
          include_tasks: win11_guest_info_exception.yml

        - name: "Check VM guestinfo from VMware Tools"
          include_tasks: check_vm_guest_info.yml
          when: win11_70u3c_exception is undefined
      rescue:
        - name: "Test case failure"
          include_tasks: ../../common/test_rescue.yml
