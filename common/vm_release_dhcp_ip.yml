---
# Release DHCP IP address in guest OS
- name: "Get VMware Tools status in guest OS"
  include_tasks: vm_get_vmtools_status.yml

- name: "Release DHCP IP address in guest OS via VMware Tools"
  when: vmtools_is_running
  block:
    - name: "Run command in guest OS via VMware Tools"
      include_tasks: vm_shell_in_guest.yml
      vars:
        vm_shell_cmd: >-
          {{ (gosv_test_suite == 'windows') | ternary('ipconfig', '/bin/sh') }}
        vm_shell_args: >-
          {% if gosv_test_suite == 'windows' %}
          /release
          {% elif guest_os_network_manager | default('') == 'NetworkManager' %}
          -c "iface=$(ip -o -4 route show to default | head -n 1 | awk '{print $5}'); conn=$(nmcli -t -f NAME,DEVICE connection show --active | grep \":$iface$\" | head -n 1 | cut -d: -f1); nmcli connection modify \"$conn\" ipv4.dhcp-send-release yes && nmcli device disconnect $iface"
          {% else %}
          -c "dhclient -r"
          {% endif %}
        vm_shell_ignore_errors: true
    
    - name: "Shutdown Linux guest OS via VMware Tools"
      vmware.vmware.vm_powerstate:
        validate_certs: "{{ validate_certs | default(false) }}"
        datacenter: "{{ vsphere_host_datacenter }}"
        hostname: "{{ vsphere_host_name }}"
        username: "{{ vsphere_host_user }}"
        password: "{{ vsphere_host_user_password }}"
        folder: "{{ vm_folder }}"
        name: "{{ vm_name }}"
        state: "shutdown-guest"
        timeout: 300
        force: true
      ignore_errors: true
      when: gosv_test_suite == 'linux'

- name: "Release DHCP IP via SSH/WinRM when VMware Tools is not running"
  when:
    - not vmtools_is_running
    - vm_guest_ip is defined and vm_guest_ip
  block:
    - name: "Release DHCP IP address in Windows guest OS"
      ansible.windows.win_shell: "ipconfig /release"
      delegate_to: "{{ vm_guest_ip }}"
      ignore_errors: true
      ignore_unreachable: true
      when: gosv_test_suite == 'windows'

    - name: "Release DHCP IP address in Linux guest OS"
      when: gosv_test_suite == 'linux'
      block:
        - name: "Run command in Linux guest OS via SSH"
          ansible.builtin.shell: >-
            {% if guest_os_network_manager | default('') == 'NetworkManager' %}
            iface=$(ip -o -4 route show to default | head -n 1 | awk '{print $5}'); conn=$(nmcli -t -f NAME,DEVICE connection show --active | grep ":$iface$" | head -n 1 | cut -d: -f1); nmcli connection modify "$conn" ipv4.dhcp-send-release yes && nmcli device disconnect $iface
            {% else %}
            dhclient -r
            {% endif %}
          delegate_to: "{{ vm_guest_ip }}"
          ignore_errors: true
          ignore_unreachable: true

        - name: "Shutdown Linux guest OS via SSH"
          ansible.builtin.shell: "poweroff"
          delegate_to: "{{ vm_guest_ip }}"
          ignore_errors: true
          ignore_unreachable: true