---
# Release DHCP IP address in guest OS
- name: "Release DHCP IP address in Windows guest OS"
  ansible.windows.win_shell: "ipconfig /release"
  delegate_to: "{{ vm_guest_ip }}"
  async: 5
  poll: 0
  ignore_errors: true
  ignore_unreachable: true
  when: 
    - gosv_test_suite == 'windows'
    - vm_guest_ip is defined and vm_guest_ip

- name: "Execute release DHCP IP address script in Linux guest OS"
  ansible.builtin.script: "{{ lookup('file', '../linux/utils/scripts/dhcp_release.py') }}"
  delegate_to: "{{ vm_guest_ip }}"
  ignore_errors: true
  ignore_unreachable: true
  register: release_dhcp_ip_result
  when:
    - gosv_test_suite == 'linux'
    - vm_guest_ip is defined and vm_guest_ip

- name: "Debug release DHCP IP address result"
  ansible.builtin.debug: var=release_dhcp_ip_result
  when: release_dhcp_ip_result is defined