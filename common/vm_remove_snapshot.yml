---
# Remove specified VM snapshot or remove all snapshots of VM
# Parameters:
#   snapshot_remove_all: can be set to true or false (default)
#   snapshot_name:
#     if snapshot_remove_all is set to true, then it's not required,
#     if snapshot_remove_all is set to false, then it's required to pass an existing snapshot name
#
- name: "Check snapshot name is valid or not when remove the existing snapshot"
  when: not (snapshot_remove_all | default(false) | bool)
  block:
    - name: "Check snapshot name is not empty"
      ansible.builtin.assert:
        that:
          - snapshot_name is defined
          - snapshot_name | string | trim | length > 0
        fail_msg: "The parameter 'snapshot_name' is not defined or is empty."

    - name: "Check if snapshot {{ snapshot_name }} exists"
      include_tasks: vm_check_snapshot_exist.yml

    - name: "Assert if snapshot does not exist on the VM"
      ansible.builtin.assert:
        that:
          - snapshot_exist
        fail_msg: "The snapshot '{{ snapshot_name }}' does not exist on the VM"

- name: "Remove snapshot on '{{ vm_name }}'"
  vmware.vmware.vm_snapshot:
    hostname: "{{ vsphere_host_name }}"
    username: "{{ vsphere_host_user }}"
    password: "{{ vsphere_host_user_password }}"
    validate_certs: "{{ validate_certs | default(false) }}"
    datacenter: "{{ vsphere_host_datacenter }}"
    folder: "{{ vm_folder }}"
    name: "{{ vm_name }}"
    state: absent
    remove_all: "{{ (snapshot_remove_all | default(false)) | bool }}"
    snapshot_name: "{{ omit if ((snapshot_remove_all | default(false)) | bool) else snapshot_name }}"
  register: task_result

- name: Display the result of remove snapshot
  ansible.builtin.debug: var=task_result
  when: enable_debug is defined and enable_debug

- name: "Check if the snapshot '{{ snapshot_name }}' is removed"
  when: not ((snapshot_remove_all | default(false)) | bool)
  block:
    - name: "Check if snapshot {{ snapshot_name }} still exists"
      include_tasks: vm_check_snapshot_exist.yml

    - name: "Assert snapshot '{{ snapshot_name }}' still exist"
      ansible.builtin.assert:
        that:
          - not snapshot_exist
        fail_msg: "Failed to remove snapshot {{ snapshot_name }}"
